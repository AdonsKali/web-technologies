<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путешественник — обо мне</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .projects {
            column-count: 2;    
            column-gap: 30px;   
        }
    </style>
</head>

<body>

    <nav class="nav">
        <a href="#skills">Навыки</a>
        <a href="#projects">Проекты</a>
        <a href="#form">Контакты</a>
        <a href="https://ru.wikipedia.org/wiki/%D0%9F%D1%83%D1%82%D0%B5%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%B8%D0%B5" target="_blank" rel="noopener">Википедия</a>
    </nav>

    <header class="header">
        <h1>Путешественник</h1>
        <h2 class="static-h2">Деревянкин Ярослав Васильевич</h2>
    </header>

    <main class="main">

        <section id="skills" class="skills">
            <h3>Навыки</h3>
            <ul>
                <li>Адаптивность и стрессоустойчивость</li>
                <li>Кросс-культурная коммуникация</li>
                <li>Ситуационная импровизация</li>
            </ul>
        </section>

        <section id="projects" class="projects">
            <h3>Проекты</h3>
            <ol>
                <li>Каракол</li>
                <li>Томск</li>
                <li>Новосибирск</li>
                <li>Астана</li>
            </ol>
        </section>

        <div class="img-box">
            <img src="images/traveler.png"
                 width="220" height="280"
                 alt="Фотография путешественника в горах">
            <span class="badge" title="Любимое место">★</span>
        </div>

        <form id="form" class="form">
            <label class="form-title">Форма для обратной связи</label>

            <label for="user">Username</label>
            <input type="text" id="user" name="username" placeholder="Иван" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

            <label for="textarea_form">Message</label>
            <textarea id="textarea_form" name="message" placeholder="Ваше сообщение"></textarea>

            <button type="submit" style="font-size: 16px;">Отправить</button>
        </form>

    </main>

    <aside id="city" class="city">
        <span class="city-dot" aria-hidden="true">●</span>
        <h2>Любимый город</h2>
        <h3>Томск ^o^</h3>
    </aside>

    <footer class="footer">
        <p>© 2026</p>
    </footer>

</body>
</html>
